<div class="max-w-xl mx-auto  flex items-center justify-center bg-gray-100 p-4 dark:bg-gray-900 transition-colors">
  <div class="w-full max-w-md bg-white shadow-lg rounded-xl p-6 space-y-6 transition-colors text-gray-900 dark:text-gray-100 dark:bg-gray-800">

    <h2 class="text-2xl font-semibold text-center  dark:bg-gray-800 dark:transition-colors dark:text-gray-100 text-gray-800">
      Upload MDR File
    </h2>

    <!-- <form class="space-y-4"> -->

      <!-- Provider -->
      <div>
        <label class="block text-sm font-medium mb-1">Provider</label>
        <select
          class="w-full border p-2  dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
          [value]="form().provider"
          (change)="onProviderChange($event)"
        >
          <option value="Mtn">MTN</option>
          <option value="Telecel">Telecel</option>
        </select>
      </div>

      <!-- File Type -->
      <div>
        <label class="block text-sm font-medium mb-1">File Type</label>
        <select
          class="w-full border rounded-lg p-2  dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
          [value]="form().fileType"
          [attr.accept]="accept()"
          (change)="onFileTypeChange($event)"
        >
          <option value="pdf">PDF</option>
          <option value="excel">Excel</option>
        </select>
      </div>

      <!-- File Input -->
      <div>
        <label class="block text-sm font-medium mb-1">Select File</label>
        <input
          [attr.accept]="form().fileType === 'pdf' ? '.pdf' : '.xlsx,.xls'"
          type="file"
          class="w-full border rounded-md p-2"
          (change)="onFileSelected($event)"
        />
      </div>

      <!-- Submit -->
      <button
       (click)="onSubmit()"
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-md disabled:bg-gray-400"
        [disabled]="!form().file || !form().provider || !form().fileType"
      >
         {{ uploading() ? 'Uploading...' : 'Upload' }}
      </button>

      <!-- Uploading Indicator -->
       @if (uploading()) {
        <div  class="mt-4" role="status" aria-live="polite" aria-label="File upload in progress">
          <p class="mb-2 text-sm text-blue-600 dark:text-blue-300">Uploading file, please wait...</p>
          <div class="h-2 w-full overflow-hidden rounded-full bg-blue-100 dark:bg-gray-700">
            <div class="h-full w-1/3 rounded-full bg-blue-600 animate-pulse"></div>
          </div>
        </div>
      }
    <!-- </form> -->
     <p class="mt-4 text-green-600">{{ message() }}</p>
  </div>
   <!-- Message -->
  
</div>
