<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900 transition-colors">
  <div class="w-full max-w-md bg-white dark:bg-gray-800 shadow-lg rounded-lg p-8 transition-colors text-gray-900 dark:text-gray-100">

    <h2 class="text-2xl font-bold text-center mb-6 text-gray-900 dark:text-gray-100">
      Reset Your Password
    </h2>

    <p class="text-center text-gray-700 dark:text-gray-300 mb-4">
      Enter your email and we’ll send you a password reset link.
    </p>

    @if (!submitted()) {
      <form (submit)="submitRequest(); $event.preventDefault()" class="space-y-5">

        <div>
          <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">
            Email Address
          </label>
          <input
            type="email"
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 
                   rounded-lg bg-white dark:bg-gray-700 
                   text-gray-900 dark:text-gray-100
                   focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400
                   transition-colors"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            required
          />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 dark:bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors duration-200"
        >
          Send Reset Link
        </button>
      </form>
    }

    <!-- Success Message -->
    @if (submitted()) {
      <div class="text-center text-gray-700 dark:text-gray-300">
        <p class="mb-4">A password reset link has been sent to:</p>
        <p class="font-semibold text-gray-900 dark:text-gray-100">{{ email() }}</p>

        <a
          routerLink="/login"
          class="mt-6 inline-block text-blue-600 dark:text-blue-400 hover:underline"
        >
          Return to Login
        </a>
      </div>
    }
    @else if (successMessage()) {
      <div class="text-center text-red-600 dark:text-red-400">
        <p class="mb-4">{{ successMessage() }}</p>
      </div>
    }
    <p class="text-center text-sm mt-6 text-gray-700 dark:text-gray-300">
      Remember your password?
      <a routerLink="/login" class="text-blue-600 dark:text-blue-400 hover:underline">
        Log in
      </a>
    </p>

  </div>
</div>
