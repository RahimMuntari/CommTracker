<!-- <div class="max-w-xl mx-auto mt-20 p-6 bg-white shadow rounded-lg"> -->
<div class="max-w-xl mx-auto mt-10 p-6 bg-white shadow rounded-lg w-full dark:bg-gray-800 dark:transition-colors text-gray-900 dark:text-gray-100">
  <h2 class="text-xl font-bold mb-4">Upload CDR File</h2>

  <!-- Provider -->
  <label class="block mb-2 font-semibold">Provider</label>
  <select
     [value]="form().provider"
    (change)="onProviderChange($event)"
    class="w-full mb-4 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
    >
    <option value="mtn">MTN</option>
    <option value="telecel">Telecel</option>
  </select>

  <!-- File Type -->
  <label class="block mb-2 font-semibold">File Type</label>
  <select
    [value]="form().fileType"
    (change)="onFileTypeChange($event)"
    class="w-full mb-4 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
  >
    <option value="pdf">PDF</option>
    <option value="excel">Excel</option>
  </select>

  <!-- File Input (restricted by fileType signal) -->
  <label class="block mb-2 font-semibold">Select File </label>
  <input
    type="file"
    [attr.accept]="accept()"
    (change)="onFileSelected($event)"
    class="block w-full mb-4 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400"
    
  />

  <!-- Upload Button -->
  <button
    (click)="upload()"
    [disabled]="uploading() || !formValid()"
    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:bg-gray-400"
  >
    {{ uploading() ? 'Uploading...' : 'Upload' }}
  </button>

  @if (uploading()) {
    <div class="mt-4" role="status" aria-live="polite" aria-label="File upload in progress">
      <p class="mb-2 text-sm text-blue-600 dark:text-blue-300">Uploading file, please wait...</p>
      <div class="h-2 w-full overflow-hidden rounded-full bg-blue-100 dark:bg-gray-700">
        <div class="h-full w-1/3 rounded-full bg-blue-600 animate-pulse"></div>
      </div>
    </div>
  }

  <!-- Message -->
  <p class="mt-4 text-green-600">{{ message() }}</p>
</div>
